[package]
name = "rustshot"
version = "0.1.0"
edition = "2021"
description = "A lightweight Windows screenshot tool with hotkey-triggered region capture, annotation, and system tray support"
license = "MIT"

[dependencies]
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
arboard = "3"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
]

[profile.release]
opt-level = 3
lto = true
strip = true
